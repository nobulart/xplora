<body style="font-family: sans-serif; overflow: hidden; background-color: #111827;">
  <div id="css-error" style="display: none; color: red; padding: 16px; text-align: center;">
    Failed to load Tailwind CSS. Please ensure /output.css exists and is accessible.
  </div>
  <div id="root"></div>
  <script type="text/babel" defer>
    const { useState, useEffect, useMemo, useRef } = React;
    const BUBBLE_IMAGE_LIMIT = 350;

    // Check if react-window loaded correctly
    if (window.ReactWindowLoadError || !window.ReactWindow) {
      const errorMsg = window.ReactWindowLoadError
        ? 'Failed to load react-window script. Please ensure /lib/react-window.umd.min.js exists, is accessible, and is a valid JavaScript file.'
        : 'react-window failed to load. Please ensure /lib/react-window.umd.min.js exists and is accessible.';
      console.error(errorMsg);
      const root = document.getElementById('root');
      root.innerHTML = `<div style="color: red; text-align: center; padding: 16px;">Error: ${errorMsg}</div>`;
      throw new Error('react-window not loaded');
    }

    const { FixedSizeGrid } = window.ReactWindow;
    const API_BASE_URL = window.location.port === '3000'
      ? 'http://localhost:8000'
      : window.location.origin;
    const UI_CACHE_PREFIX = 'xplora:api:';
    const UI_CACHE_TTL_MS = 10 * 60 * 1000;

    const getMediaUrl = (url) => {
      if (!url) return '';
      if (url.startsWith('/backup_media') || url.startsWith('/tweets_media') || url.startsWith('/media-cache')) {
        return `${API_BASE_URL}${url}`;
      }
      return url;
    };

    const getCachedPayload = (key) => {
      try {
        const rawValue = localStorage.getItem(`${UI_CACHE_PREFIX}${key}`);
        if (!rawValue) return null;
        const cached = JSON.parse(rawValue);
        if (!cached.savedAt || Date.now() - cached.savedAt > UI_CACHE_TTL_MS) {
          return null;
        }
        return cached;
      } catch (err) {
        return null;
      }
    };

    const setCachedPayload = (key, data, etag) => {
      try {
        localStorage.setItem(`${UI_CACHE_PREFIX}${key}`, JSON.stringify({
          data,
          etag,
          savedAt: Date.now()
        }));
      } catch (err) {
        // Ignore quota errors; the app should still work without client caching.
      }
    };

    const getTweetsCacheKey = (params) => {
      const sortedEntries = Object.entries(params).sort(([left], [right]) => left.localeCompare(right));
      return `tweets:${JSON.stringify(sortedEntries)}`;
    };

    const App = () => {
      const [file, setFile] = useState(null);
      const [tweets, setTweets] = useState([]);
      const [filteredTweets, setFilteredTweets] = useState([]);
      const [query, setQuery] = useState('');
      const [selectedInterest, setSelectedInterest] = useState(localStorage.getItem('selectedInterest') || '');
      const [loading, setLoading] = useState(false);
      const [rendering, setRendering] = useState(false);
      const [uploadProgress, setUploadProgress] = useState(0);
      const [displayProgress, setDisplayProgress] = useState(0);
      const [error, setError] = useState('');
      const [analysis, setAnalysis] = useState({ topics: [], clusters: [], interests: [] });
      const [warmupStatus, setWarmupStatus] = useState({
        state: 'starting',
        message: 'Connecting to backend warmup',
        progress: 0,
        processed: 0,
        total: 0,
        ready: false,
        error: null
      });
      const [selectedTweet, setSelectedTweet] = useState(null);
      const [selectedTweetLoading, setSelectedTweetLoading] = useState(false);
      const [layout, setLayout] = useState(localStorage.getItem('layout') || 'bubble');
      const [scale, setScale] = useState(parseFloat(localStorage.getItem('scale')) || 1.0);
      const [showImages, setShowImages] = useState(localStorage.getItem('showImages') === 'true');
      const [showVideos, setShowVideos] = useState(localStorage.getItem('showVideos') === 'true');
      const [showLinks, setShowLinks] = useState(localStorage.getItem('showLinks') === 'true');
      const [queryMode, setQueryMode] = useState(localStorage.getItem('queryMode') || 'all');
      const [sortBy, setSortBy] = useState(localStorage.getItem('sortBy') || 'date');
      const [sortOrder, setSortOrder] = useState(localStorage.getItem('sortOrder') || 'desc');
      const [bubbleLayout, setBubbleLayout] = useState(localStorage.getItem('bubbleLayout') || 'cloud');
      const [bubbleSpacing, setBubbleSpacing] = useState(parseFloat(localStorage.getItem('bubbleSpacing')) || 1.2);
      const [isPanelVisible, setIsPanelVisible] = useState(localStorage.getItem('isPanelVisible') !== 'false');
      const canvasRef = useRef(null);
      const bubbleNodesRef = useRef([]);
      const bubbleTransformRef = useRef({ x: 0, y: 0, k: 1 });
      const bubbleDragRef = useRef({ active: false, moved: false, x: 0, y: 0 });
      const bubbleImageCacheRef = useRef(new Map());
      const [dimensions, setDimensions] = useState({ width: window.innerWidth, height: window.innerHeight });
      const [dateRange, setDateRange] = useState({ start: null, end: null });
      const [pendingDateRange, setPendingDateRange] = useState({ start: null, end: null });
      const [initialDateLimits, setInitialDateLimits] = useState({ min: null, max: null });
      const [hasSetInitialDateLimits, setHasSetInitialDateLimits] = useState(false);
      const [zoomLevel, setZoomLevel] = useState(1);
      const fileInputRef = useRef(null);

      // Smooth progress update effect
      useEffect(() => {
        if (!loading) {
          setDisplayProgress(0);
          return;
        }
        if (uploadProgress === 0) return;

        const interval = setInterval(() => {
          setDisplayProgress(prev => {
            if (prev >= uploadProgress) {
              clearInterval(interval);
              return prev;
            }
            const next = Math.min(prev + 1, uploadProgress);
            return next;
          });
        }, 50);

        return () => clearInterval(interval);
      }, [loading, uploadProgress]);

      useEffect(() => {
        if (
          selectedInterest &&
          analysis.interests.length > 0 &&
          !analysis.interests.includes(selectedInterest)
        ) {
          setSelectedInterest('');
          localStorage.removeItem('selectedInterest');
        }
      }, [analysis.interests, selectedInterest]);

      const handleLayoutChange = (newLayout) => {
        setLayout(newLayout);
        localStorage.setItem('layout', newLayout);
      };

      const handleScaleChange = (e) => {
        const newScale = parseFloat(e.target.value);
        setScale(newScale);
        localStorage.setItem('scale', newScale);
      };

      const updateStoredState = (setter, key, value) => {
        setter(value);
        localStorage.setItem(key, value);
      };

      const togglePanelVisibility = () => {
        setIsPanelVisible((currentValue) => {
          const nextValue = !currentValue;
          localStorage.setItem('isPanelVisible', String(nextValue));
          return nextValue;
        });
      };

      const handleFileChange = (e) => {
        const selectedFile = e.target.files[0];
        const validExtensions = ['.js', '.gz', '.zip'];
        const hasValidExtension = selectedFile && validExtensions.some((extension) =>
          selectedFile.name.toLowerCase().endsWith(extension)
        );
        if (hasValidExtension) {
          setFile(selectedFile);
          setError('');
          handleUpload(selectedFile);
        } else {
          setError('Please upload a valid tweets.js, .gz, or .zip file');
        }
      };

      const handleUploadClick = () => {
        fileInputRef.current.click();
      };

      const handleUpload = async (selectedFile) => {
        if (!selectedFile) return;
        setLoading(true);
        setUploadProgress(0);
        setDisplayProgress(0);

        const formData = new FormData();
        formData.append('file', selectedFile);

        try {
          const response = await axios.post(`${API_BASE_URL}/upload`, formData, {
            onUploadProgress: (progressEvent) => {
              const percentCompleted = Math.round((progressEvent.loaded * 100) / progressEvent.total);
              setUploadProgress(percentCompleted);
            },
          });
          setLoading(false);
          setRendering(true);

          console.log("Backend response:", response.data);
          console.log("Tweets length:", response.data.tweets.length);
          const loadedTweets = response.data.tweets || [];
          setTweets(loadedTweets);
          setFilteredTweets(loadedTweets);

          if (loadedTweets.length > 0 && response.data.initialDateRange && !hasSetInitialDateLimits) {
            const { minDate, maxDate } = response.data.initialDateRange;
            setInitialDateLimits({ min: minDate, max: maxDate });
            setHasSetInitialDateLimits(true);
            const oneYearInMs = 366 * 24 * 60 * 60 * 1000;
            const defaultStart = Math.max(minDate, maxDate - oneYearInMs);
            setDateRange({ start: defaultStart, end: maxDate });
            setPendingDateRange({ start: defaultStart, end: maxDate });
            console.log("Initial date limits set:", { min: minDate, max: maxDate });
            console.log("Date range initialized to last 366 days:", { start: defaultStart, end: maxDate });
          } else if (!loadedTweets.length) {
            setInitialDateLimits({ min: null, max: null });
            setHasSetInitialDateLimits(false);
            setDateRange({ start: null, end: null });
            setPendingDateRange({ start: null, end: null });
            console.log("No tweets loaded, initial date limits and range reset to null");
          }

          setAnalysis(response.data.analysis || { topics: [], clusters: [], interests: [] });
          setError('');
        } catch (err) {
          console.error("Upload error:", err);
          const detail = err.response?.data?.detail || err.message || 'Unknown error';
          setError('Error processing file: ' + detail);
        } finally {
          setLoading(false);
          setUploadProgress(0);
          setDisplayProgress(0);
          setRendering(false);
        }
      };

      const handleTweetSelect = async (tweet) => {
        if (tweet.full_text) {
          setSelectedTweetLoading(false);
          setSelectedTweet(tweet);
          return;
        }

        const detailCacheKey = `tweet:${tweet.id}`;
        const cachedDetail = getCachedPayload(detailCacheKey);
        if (cachedDetail?.data) {
          setSelectedTweetLoading(false);
          setSelectedTweet(cachedDetail.data);
          return;
        }

        setSelectedTweetLoading(true);
        setSelectedTweet(tweet);
        try {
          const response = await axios.get(`${API_BASE_URL}/tweets/${tweet.id}`, {
            headers: cachedDetail?.etag ? { 'If-None-Match': cachedDetail.etag } : {},
            validateStatus: (status) => (status >= 200 && status < 300) || status === 304
          });
          if (response.status === 304 && cachedDetail?.data) {
            setSelectedTweet(cachedDetail.data);
            return;
          }
          setSelectedTweet(response.data);
          setCachedPayload(detailCacheKey, response.data, response.headers.etag);
        } catch (err) {
          console.error("Error fetching tweet details:", err);
          setError('Error fetching tweet details: ' + (err.message || 'Unknown error'));
        } finally {
          setSelectedTweetLoading(false);
        }
      };

      // Fetch pre-processed tweets from the server
      const fetchTweets = async () => {
        const params = {
          query: query || '',
          queryMode: queryMode,
          interest: selectedInterest || '',
          dateStart: dateRange.start || '',
          dateEnd: dateRange.end || '',
          showImages: showImages,
          showVideos: showVideos,
          showLinks: showLinks,
          sortBy: sortBy,
          sortOrder: sortOrder,
        };
        const cacheKey = getTweetsCacheKey(params);
        const cached = getCachedPayload(cacheKey);
        if (cached?.data?.startupStatus?.ready) {
          applyTweetsResponse(cached.data, { fromCache: true });
        }

        try {
          setLoading(true);
          const response = await axios.get(`${API_BASE_URL}/tweets`, {
            params,
            headers: cached?.etag ? { 'If-None-Match': cached.etag } : {},
            validateStatus: (status) => (status >= 200 && status < 300) || status === 304
          });
          if (response.status === 304 && cached?.data) {
            applyTweetsResponse(cached.data);
            return;
          }
          console.log("Fetched tweets from server:", response.data);
          if (!response.data.startupStatus?.ready && cached?.data?.startupStatus?.ready) {
            setWarmupStatus(response.data.startupStatus);
            return;
          }
          applyTweetsResponse(response.data);
          setCachedPayload(cacheKey, response.data, response.headers.etag);
          setError('');
        } catch (err) {
          console.error("Error fetching tweets:", err);
          setError('Error fetching tweets: ' + (err.message || 'Unknown error'));
        } finally {
          setLoading(false);
        }
      };

      const applyTweetsResponse = (data, options = {}) => {
        if (data.startupStatus) {
          setWarmupStatus(data.startupStatus);
          if (!data.startupStatus.ready && !options.fromCache) {
            setTweets([]);
            setFilteredTweets([]);
            return;
          }
        }

        const loadedTweets = data.tweets || [];
        setTweets(loadedTweets);
        setFilteredTweets(loadedTweets);

        if (loadedTweets.length > 0 && data.initialDateRange && !hasSetInitialDateLimits) {
          const { minDate, maxDate } = data.initialDateRange;
          setInitialDateLimits({ min: minDate, max: maxDate });
          setHasSetInitialDateLimits(true);
          const oneYearInMs = 366 * 24 * 60 * 60 * 1000;
          const defaultStart = Math.max(minDate, maxDate - oneYearInMs);
          setDateRange(prev => prev.start && prev.end ? prev : { start: defaultStart, end: maxDate });
          setPendingDateRange(prev => prev.start && prev.end ? prev : { start: defaultStart, end: maxDate });
        } else if (!loadedTweets.length && !options.fromCache) {
          setDateRange(prev => prev.start || prev.end ? { start: null, end: null } : prev);
          setPendingDateRange(prev => prev.start || prev.end ? { start: null, end: null } : prev);
        }

        setAnalysis(data.analysis || { topics: [], clusters: [], interests: [] });
      };

      useEffect(() => {
        if (warmupStatus.ready) {
          return undefined;
        }

        let cancelled = false;

        const pollStartupStatus = async () => {
          try {
            const response = await axios.get(`${API_BASE_URL}/startup-status`);
            if (cancelled) return;

            const status = response.data;
            setWarmupStatus(status);

            if (status.ready && tweets.length === 0) {
              fetchTweets();
            }
          } catch (err) {
            if (!cancelled) {
              setWarmupStatus(prev => ({
                ...prev,
                state: 'connecting',
                message: 'Waiting for backend to accept connections',
                ready: false,
                error: null
              }));
            }
          }
        };

        pollStartupStatus();
        const interval = setInterval(pollStartupStatus, 1000);

        return () => {
          cancelled = true;
          clearInterval(interval);
        };
      }, [warmupStatus.ready, tweets.length]);

      // Trigger fetchTweets only when other filters change, not dateRange
      useEffect(() => {
        if (warmupStatus.ready) {
          fetchTweets();
        }
      }, [query, queryMode, selectedInterest, showImages, showVideos, showLinks, sortBy, sortOrder, warmupStatus.ready]);

      // Update chart when dateRange is finalized (on mouse up)
      useEffect(() => {
        if (warmupStatus.ready) {
          fetchTweets();
        }
      }, [dateRange, warmupStatus.ready]);

      useEffect(() => {
        const handleResize = () => {
          setDimensions({ width: window.innerWidth, height: window.innerHeight });
        };

        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const drawBubbleCanvas = () => {
        const canvas = canvasRef.current;
        if (!canvas || layout !== 'bubble') return;

        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const { width, height } = dimensions;
        const nodes = bubbleNodesRef.current;
        const transform = bubbleTransformRef.current;

        canvas.width = Math.max(1, Math.floor(width * dpr));
        canvas.height = Math.max(1, Math.floor(height * dpr));
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#111827';
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.translate(transform.x, transform.y);
        ctx.scale(transform.k, transform.k);

        nodes.forEach((node, index) => {
          ctx.beginPath();
          ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
          ctx.fillStyle = node.color;
          ctx.fill();
          ctx.lineWidth = 3 / transform.k;
          ctx.strokeStyle = '#000';
          ctx.stroke();

          if (!node.media || index >= BUBBLE_IMAGE_LIMIT || node.r < 18) {
            drawBubblePlaceholder(ctx, node, transform);
            return;
          }

          const cache = bubbleImageCacheRef.current;
          const mediaUrl = getMediaUrl(node.media);
          let image = cache.get(mediaUrl);
          if (!image) {
            image = new Image();
            image.onload = drawBubbleCanvas;
            image.onerror = () => cache.delete(mediaUrl);
            image.src = mediaUrl;
            cache.set(mediaUrl, image);
          }
          if (!image.complete || !image.naturalWidth) return;

          ctx.save();
          ctx.beginPath();
          ctx.arc(node.x, node.y, node.r * 0.78, 0, Math.PI * 2);
          ctx.clip();
          ctx.drawImage(
            image,
            node.x - node.r * 0.78,
            node.y - node.r * 0.78,
            node.r * 1.56,
            node.r * 1.56
          );
          ctx.restore();
        });

        ctx.restore();
      };

      const drawBubblePlaceholder = (ctx, node, transform) => {
        if (node.r < 14) return;

        const innerRadius = node.r * 0.62;
        const lineWidth = Math.max(1.2, 2 / transform.k);
        ctx.save();
        ctx.globalAlpha = node.r > 28 ? 0.36 : 0.24;
        ctx.beginPath();
        ctx.arc(node.x, node.y, innerRadius, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = lineWidth;
        ctx.stroke();

        const lineCount = node.r > 34 ? 3 : 2;
        const lineStart = node.x - innerRadius * 0.48;
        const baseY = node.y - (lineCount - 1) * innerRadius * 0.16;
        ctx.lineCap = 'round';
        for (let index = 0; index < lineCount; index += 1) {
          const width = innerRadius * (index === lineCount - 1 ? 0.58 : 0.96);
          const y = baseY + index * innerRadius * 0.32;
          ctx.beginPath();
          ctx.moveTo(lineStart, y);
          ctx.lineTo(lineStart + width, y);
          ctx.stroke();
        }
        ctx.restore();
      };

      const getBubbleWorldPoint = (event) => {
        const rect = canvasRef.current.getBoundingClientRect();
        const transform = bubbleTransformRef.current;
        return {
          x: (event.clientX - rect.left - transform.x) / transform.k,
          y: (event.clientY - rect.top - transform.y) / transform.k
        };
      };

      const handleBubbleWheel = (event) => {
        event.preventDefault();
        const rect = canvasRef.current.getBoundingClientRect();
        const transform = bubbleTransformRef.current;
        const oldScale = transform.k;
        const nextScale = Math.min(5, Math.max(0.15, oldScale * (event.deltaY < 0 ? 1.1 : 0.9)));
        const pointerX = event.clientX - rect.left;
        const pointerY = event.clientY - rect.top;
        const worldX = (pointerX - transform.x) / oldScale;
        const worldY = (pointerY - transform.y) / oldScale;

        bubbleTransformRef.current = {
          x: pointerX - worldX * nextScale,
          y: pointerY - worldY * nextScale,
          k: nextScale
        };
        setZoomLevel(nextScale);
        drawBubbleCanvas();
      };

      const handleBubblePointerDown = (event) => {
        event.currentTarget.setPointerCapture(event.pointerId);
        bubbleDragRef.current = {
          active: true,
          moved: false,
          x: event.clientX,
          y: event.clientY
        };
      };

      const handleBubblePointerMove = (event) => {
        const drag = bubbleDragRef.current;
        if (!drag.active) return;

        const dx = event.clientX - drag.x;
        const dy = event.clientY - drag.y;
        if (Math.abs(dx) + Math.abs(dy) > 3) {
          drag.moved = true;
        }

        const transform = bubbleTransformRef.current;
        bubbleTransformRef.current = {
          ...transform,
          x: transform.x + dx,
          y: transform.y + dy
        };
        drag.x = event.clientX;
        drag.y = event.clientY;
        drawBubbleCanvas();
      };

      const handleBubblePointerUp = (event) => {
        const drag = bubbleDragRef.current;
        bubbleDragRef.current = { active: false, moved: false, x: 0, y: 0 };
        if (drag.moved) return;

        const point = getBubbleWorldPoint(event);
        const nodes = bubbleNodesRef.current;
        for (let index = nodes.length - 1; index >= 0; index -= 1) {
          const node = nodes[index];
          const dx = point.x - node.x;
          const dy = point.y - node.y;
          if ((dx * dx) + (dy * dy) <= node.r * node.r) {
            handleTweetSelect(node.tweet);
            return;
          }
        }
      };

      const buildBubbleNodes = (items, width, height) => {
        const maxEngagement = Math.max(
          1,
          ...items.map(tweet => tweet.favorite_count + tweet.retweet_count)
        );
        const sortedItems = [...items].sort((a, b) => {
          if (bubbleLayout === 'timeline') {
            return (a.created_ts || 0) - (b.created_ts || 0);
          }
          return (b.favorite_count + b.retweet_count) - (a.favorite_count + a.retweet_count);
        });

        const nodes = sortedItems.map(tweet => {
          const engagement = tweet.favorite_count + tweet.retweet_count;
          const sizeFactor = Math.log1p(engagement) / Math.log1p(maxEngagement + 1);
          return {
            id: tweet.id,
            x: 0,
            y: 0,
            r: (5 + sizeFactor * 30) * scale,
            color: tweet.color,
            media: tweet.media.length > 0 ? tweet.media[0].url : null,
            tweet
          };
        });

        if (bubbleLayout === 'timeline') {
          const minTs = Math.min(...nodes.map(node => node.tweet.created_ts || 0));
          const maxTs = Math.max(...nodes.map(node => node.tweet.created_ts || 0));
          const lanes = Math.max(8, Math.floor(Math.sqrt(nodes.length) / 2));
          nodes.forEach((node, index) => {
            const ts = node.tweet.created_ts || minTs;
            const progress = maxTs === minTs ? 0.5 : (ts - minTs) / (maxTs - minTs);
            const lane = index % lanes;
            node.x = progress * Math.max(width * 2.8, 1600);
            node.y = lane * (46 * bubbleSpacing * scale) + ((index % 2) * 14 * scale);
          });
          return nodes;
        }

        if (bubbleLayout === 'cloud') {
          const goldenAngle = Math.PI * (3 - Math.sqrt(5));
          nodes.forEach((node, index) => {
            const distance = Math.sqrt(index) * (28 + node.r * 0.75) * bubbleSpacing;
            const angle = index * goldenAngle;
            node.x = Math.cos(angle) * distance;
            node.y = Math.sin(angle) * distance;
          });
          return nodes;
        }

        const rowTargetWidth = Math.max(900, Math.sqrt(nodes.length) * 56 * bubbleSpacing * scale);
        let x = 0;
        let y = 0;
        let rowHeight = 0;
        nodes.forEach(node => {
          const diameter = node.r * 2;
          if (x > 0 && x + diameter > rowTargetWidth) {
            x = 0;
            y += rowHeight + 8 * bubbleSpacing * scale;
            rowHeight = 0;
          }
          node.x = x + node.r;
          node.y = y + node.r;
          x += diameter + 8 * bubbleSpacing * scale;
          rowHeight = Math.max(rowHeight, diameter);
        });
        return nodes;
      };

      useEffect(() => {
        if (!filteredTweets.length || layout !== 'bubble') return;

        const { width, height } = dimensions;
        const nodes = buildBubbleNodes(filteredTweets, width, height);

        bubbleNodesRef.current = nodes;

        if (nodes.length) {
          const bounds = nodes.reduce((acc, node) => ({
            minX: Math.min(acc.minX, node.x - node.r),
            maxX: Math.max(acc.maxX, node.x + node.r),
            minY: Math.min(acc.minY, node.y - node.r),
            maxY: Math.max(acc.maxY, node.y + node.r)
          }), {
            minX: Infinity,
            maxX: -Infinity,
            minY: Infinity,
            maxY: -Infinity
          });
          const contentWidth = bounds.maxX - bounds.minX;
          const contentHeight = bounds.maxY - bounds.minY;
          if (bubbleLayout === 'packed') {
            bubbleTransformRef.current = {
              x: Math.min(420, width * 0.23),
              y: 72,
              k: 1
            };
            setZoomLevel(1);
          } else {
            const fitScale = Math.min(
              1.4,
              (width - 80) / Math.max(contentWidth, 1),
              (height - 80) / Math.max(contentHeight, 1)
            );
            bubbleTransformRef.current = {
              x: (width - contentWidth * fitScale) / 2 - bounds.minX * fitScale,
              y: (height - contentHeight * fitScale) / 2 - bounds.minY * fitScale,
              k: fitScale
            };
            setZoomLevel(fitScale);
          }
        }

        drawBubbleCanvas();
      }, [filteredTweets, dimensions, layout, scale, bubbleLayout, bubbleSpacing]);

      const renderTweetText = (tweet) => {
        let text = tweet.full_text;
        if (!text) {
          return { __html: tweet.text_preview || '' };
        }
        
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        text = text.replace(urlRegex, url => (
          `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-blue-500 underline">${url}</a>`
        ));

        if (tweet.user_mentions && Array.isArray(tweet.user_mentions)) {
          tweet.user_mentions.forEach(mention => {
            const mentionRegex = new RegExp(`@${mention.screen_name}\\b`, 'gi');
            text = text.replace(mentionRegex, `<a href="https://x.com/${mention.screen_name}" target="_blank" rel="noopener noreferrer" class="text-blue-500 underline">@${mention.screen_name}</a>`);
          });
        }

        if (tweet.hashtags && Array.isArray(tweet.hashtags)) {
          tweet.hashtags.forEach(hashtag => {
            const hashtagRegex = new RegExp(`#${hashtag.text}\\b`, 'gi');
            text = text.replace(hashtagRegex, `<a href="https://x.com/hashtag/${hashtag.text}" target="_blank" rel="noopener noreferrer" class="text-blue-500 underline">#${hashtag.text}</a>`);
          });
        }

        return { __html: text };
      };

      const handleDateRangeChange = (e, type) => {
        const value = parseInt(e.target.value);
        setPendingDateRange(prev => {
          const newRange = { ...prev };
          newRange[type] = value;
          if (type === 'start' && value > prev.end) {
            newRange.end = value;
          } else if (type === 'end' && value < prev.start) {
            newRange.start = value;
          }
          console.log("Pending date range updated:", newRange);
          return newRange;
        });
      };

      const handleDateRangeCommit = () => {
        setDateRange(pendingDateRange);
        console.log("Date range committed:", pendingDateRange);
      };

      const getRangeFillStyle = () => {
        if (!initialDateLimits.min || !initialDateLimits.max || !pendingDateRange.start || !pendingDateRange.end) return { left: '0%', width: '0%' };
        const range = initialDateLimits.max - initialDateLimits.min;
        const leftPercent = ((pendingDateRange.start - initialDateLimits.min) / range) * 100;
        const widthPercent = ((pendingDateRange.end - pendingDateRange.start) / range) * 100;
        return {
          left: `${leftPercent}%`,
          width: `${widthPercent}%`
        };
      };

      const formatDate = (timestamp) => {
        return timestamp ? new Date(timestamp).toLocaleDateString() : 'N/A';
      };

      const getGridCols = (availableWidth) => {
        const cellWidth = 150 * scale;
        const maxColumns = Math.floor(availableWidth / cellWidth);
        const adjustedCols = Math.max(1, maxColumns);
        return adjustedCols;
      };

      const GridItem = ({ columnIndex, rowIndex, style, data }) => {
        const index = rowIndex * data.columnCount + columnIndex;
        if (index >= data.items.length) return null;
        const tweet = data.items[index];
        const showMedia = scale >= 0.75;
        const hasMedia = tweet.media.length > 0;
        return (
          <div
            style={{
              ...style,
              width: 150 * scale,
              height: 150 * scale,
            }}
            className="grid-cell bg-gray-800 p-2 rounded-lg shadow cursor-pointer hover:shadow-lg transition-shadow flex flex-col"
            onClick={() => handleTweetSelect(tweet)}
          >
            {hasMedia && showMedia && (
              <img
                src={getMediaUrl(tweet.media[0].url)}
                alt="Tweet media"
                className="rounded mb-1"
              />
            )}
            {(!hasMedia || !showMedia) && (
              <div
                className="grid-placeholder mb-1"
                aria-hidden="true"
                style={{
                  opacity: showMedia ? 1 : 0.72,
                  backgroundColor: tweet.color
                }}
              ></div>
            )}
            <p
              className="text-xs text-gray-200 truncate flex-1 overflow-hidden"
              style={{ fontSize: `${12 * scale}px` }}
            >
              {tweet.text_preview || tweet.full_text}
            </p>
            <p
              className="text-[10px] text-gray-400 mt-0.5"
              style={{ fontSize: `${10 * scale}px` }}
            >
              {new Date(tweet.created_at).toLocaleString()}
            </p>
            <div
              className="flex justify-between mt-0.5 text-[10px] text-gray-400"
              style={{ fontSize: `${10 * scale}px` }}
            >
              <span>Likes: {tweet.favorite_count}</span>
              <span>Retweets: {tweet.retweet_count}</span>
            </div>
          </div>
        );
      };

      return (
        <div style={{ position: 'relative', width: '100vw', height: '100vh' }}>
          {layout === 'bubble' && (
            filteredTweets.length > 0 ? (
              <canvas
                ref={canvasRef}
                onWheel={handleBubbleWheel}
                onPointerDown={handleBubblePointerDown}
                onPointerMove={handleBubblePointerMove}
                onPointerUp={handleBubblePointerUp}
                onPointerCancel={() => {
                  bubbleDragRef.current = { active: false, moved: false, x: 0, y: 0 };
                }}
                style={{
                  position: 'absolute',
                  inset: 0,
                  width: '100%',
                  height: '100%',
                  cursor: 'grab',
                  touchAction: 'none'
                }}
              ></canvas>
            ) : (
              <div style={{ textAlign: 'center', color: '#9ca3af', marginTop: '16px' }}>
                No tweets to display. Adjust filters or upload a file.
              </div>
            )
          )}

          {layout === 'grid' && (
            <div style={{ position: 'absolute', inset: 0, padding: '8px' }} className="grid-container">
              {filteredTweets.length > 0 ? (
                <FixedSizeGrid
                  columnCount={getGridCols(dimensions.width - 16)}
                  columnWidth={150 * scale}
                  height={dimensions.height - 16}
                  rowCount={Math.ceil(filteredTweets.length / getGridCols(dimensions.width - 16))}
                  rowHeight={150 * scale}
                  width={dimensions.width - 16}
                  itemData={{
                    items: filteredTweets,
                    columnCount: getGridCols(dimensions.width - 16)
                  }}
                >
                  {GridItem}
                </FixedSizeGrid>
              ) : (
                <div style={{ textAlign: 'center', color: '#9ca3af', marginTop: '16px' }}>
                  No tweets to display. Adjust filters or upload a file.
                </div>
              )}
            </div>
          )}

          {!isPanelVisible && (
            <button
              type="button"
              className="panel-toggle"
              onClick={togglePanelVisibility}
              title="Show controls"
              aria-label="Show controls"
            >
              <span className="hamburger-lines" aria-hidden="true"></span>
            </button>
          )}

          {isPanelVisible && (
          <div className="control-panel">
            <div className="panel-header">
              <div className="panel-heading">
                <div className="panel-title-row">
                  <div className="panel-title">Xplorer</div>
                  <div className="version-label">V1.0</div>
                </div>
                <div className="panel-count">{filteredTweets.length} of {tweets.length || warmupStatus.total || 0} tweets</div>
              </div>
              <input
                type="file"
                accept=".js,.gz,.zip,application/gzip,application/zip"
                ref={fileInputRef}
                style={{ display: 'none' }}
                onChange={handleFileChange}
              />
              <div className="panel-header-actions">
                <button
                  onClick={handleUploadClick}
                  disabled={loading || rendering}
                  className="panel-button"
                  style={{ width: '112px' }}
                >
                  {loading ? `${displayProgress}%` : rendering ? 'Rendering' : warmupStatus.ready ? 'Upload' : `${warmupStatus.progress || 0}%`}
                </button>
                <button
                  type="button"
                  className="panel-icon-button"
                  onClick={togglePanelVisibility}
                  title="Hide controls"
                  aria-label="Hide controls"
                >
                  <span className="hamburger-lines" aria-hidden="true"></span>
                </button>
              </div>
            </div>

            {error && <p className="text-red-500 text-xs mt-1">{error}</p>}

            {!warmupStatus.ready && (
              <div className="panel-section">
                <label className="panel-label">{warmupStatus.message || 'Warming up'}</label>
                <div className="h-2 bg-gray-700 rounded overflow-hidden">
                  <div
                    className="h-full bg-blue-500"
                    style={{ width: `${Math.min(Math.max(warmupStatus.progress || 0, 0), 100)}%` }}
                  ></div>
                </div>
              </div>
            )}

            <div className="panel-section">
              <label className="panel-label">Search</label>
              <input
                type="search"
                placeholder="words, @mentions, links..."
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                className="panel-control"
              />
              <div className="panel-row">
                <select
                  value={queryMode}
                  onChange={(e) => updateStoredState(setQueryMode, 'queryMode', e.target.value)}
                  className="panel-control"
                >
                  <option value="all">Match all words</option>
                  <option value="any">Match any word</option>
                </select>
                <select
                  value={selectedInterest}
                  onChange={(e) => updateStoredState(setSelectedInterest, 'selectedInterest', e.target.value)}
                  className="panel-control"
                >
                  <option value="">All interests</option>
                  {analysis.interests.map(interest => (
                    <option key={interest} value={interest}>{interest}</option>
                  ))}
                </select>
              </div>
            </div>

            <div className="panel-section">
              <label className="panel-label">View</label>
              <div className="segmented">
                <button
                  type="button"
                  className={layout === 'bubble' ? 'active' : ''}
                  onClick={() => handleLayoutChange('bubble')}
                >
                  Bubbles
                </button>
                <button
                  type="button"
                  className={layout === 'grid' ? 'active' : ''}
                  onClick={() => handleLayoutChange('grid')}
                >
                  Cards
                </button>
              </div>
              <div className="panel-row">
                <select
                  value={sortBy}
                  onChange={(e) => updateStoredState(setSortBy, 'sortBy', e.target.value)}
                  className="panel-control"
                >
                  <option value="date">Sort by date</option>
                  <option value="engagement">Sort by engagement</option>
                  <option value="likes">Sort by likes</option>
                  <option value="retweets">Sort by retweets</option>
                </select>
                <select
                  value={sortOrder}
                  onChange={(e) => updateStoredState(setSortOrder, 'sortOrder', e.target.value)}
                  className="panel-control"
                >
                  <option value="desc">Descending</option>
                  <option value="asc">Ascending</option>
                </select>
              </div>
              <div className="panel-row">
                <select
                  value={bubbleLayout}
                  onChange={(e) => updateStoredState(setBubbleLayout, 'bubbleLayout', e.target.value)}
                  className="panel-control"
                  disabled={layout !== 'bubble'}
                >
                  <option value="packed">Packed rows</option>
                  <option value="cloud">Radial cloud</option>
                  <option value="timeline">Timeline lanes</option>
                </select>
                <div>
                  <input
                    type="range"
                    min="0.8"
                    max="2.4"
                    step="0.1"
                    value={bubbleSpacing}
                    onChange={(e) => updateStoredState(setBubbleSpacing, 'bubbleSpacing', parseFloat(e.target.value))}
                    className="panel-control"
                    disabled={layout !== 'bubble'}
                    title="Bubble spacing"
                  />
                </div>
              </div>
              <label className="panel-label" style={{ marginTop: '10px' }}>Scale {scale.toFixed(1)}x</label>
              <input
                type="range"
                min="0.5"
                max="2.0"
                step="0.1"
                value={scale}
                onChange={handleScaleChange}
                className="panel-control"
              />
            </div>

            <div className="panel-section">
              <label className="panel-label">Media filters</label>
              <div className="chip-row">
                <label className="chip-toggle">
                  <input
                    type="checkbox"
                    checked={showImages}
                    onChange={(e) => updateStoredState(setShowImages, 'showImages', e.target.checked)}
                  />
                  Images
                </label>
                <label className="chip-toggle">
                  <input
                    type="checkbox"
                    checked={showVideos}
                    onChange={(e) => updateStoredState(setShowVideos, 'showVideos', e.target.checked)}
                  />
                  Videos
                </label>
                <label className="chip-toggle">
                  <input
                    type="checkbox"
                    checked={showLinks}
                    onChange={(e) => updateStoredState(setShowLinks, 'showLinks', e.target.checked)}
                  />
                  Links
                </label>
              </div>
            </div>

            {initialDateLimits.min && initialDateLimits.max && (
              <div className="panel-section">
                <label className="panel-label">Date range</label>
                <div className="range-slider-container">
                  <input
                    type="range"
                    min={initialDateLimits.min}
                    max={initialDateLimits.max}
                    value={pendingDateRange.start || initialDateLimits.min}
                    onChange={(e) => handleDateRangeChange(e, 'start')}
                    onMouseUp={handleDateRangeCommit}
                    onTouchEnd={handleDateRangeCommit}
                  />
                  <input
                    type="range"
                    min={initialDateLimits.min}
                    max={initialDateLimits.max}
                    value={pendingDateRange.end || initialDateLimits.max}
                    onChange={(e) => handleDateRangeChange(e, 'end')}
                    onMouseUp={handleDateRangeCommit}
                    onTouchEnd={handleDateRangeCommit}
                  />
                  <div className="range-fill" style={getRangeFillStyle()}></div>
                </div>
                <div className="date-readout">
                  <span>{formatDate(pendingDateRange.start)}</span>
                  <span>{formatDate(pendingDateRange.end)}</span>
                </div>
              </div>
            )}
          </div>
          )}

          {selectedTweet && (
            <div className="tweet-modal-backdrop">
              <div className="tweet-modal">
                <div className="tweet-modal-header">
                  <div>
                    <h2 className="text-lg font-bold text-white">Tweet Details</h2>
                    {selectedTweetLoading && (
                      <p className="text-xs text-gray-400 mt-1">Loading full details...</p>
                    )}
                  </div>
                  <button
                    onClick={() => setSelectedTweet(null)}
                    className="modal-action secondary"
                  >
                    Close
                  </button>
                </div>
                <div className="tweet-modal-body">
                  <div className="tweet-modal-section">
                    <div className="tweet-text" dangerouslySetInnerHTML={renderTweetText(selectedTweet)} />
                    <div className="tweet-meta-grid">
                      <div className="tweet-meta-item">
                        <span className="tweet-meta-label">Date</span>
                        <span>{new Date(selectedTweet.created_at).toLocaleString()}</span>
                      </div>
                      <div className="tweet-meta-item">
                        <span className="tweet-meta-label">Likes</span>
                        <span>{selectedTweet.favorite_count}</span>
                      </div>
                      <div className="tweet-meta-item">
                        <span className="tweet-meta-label">Retweets</span>
                        <span>{selectedTweet.retweet_count}</span>
                      </div>
                    </div>
                    {(selectedTweet.user_mentions || []).length > 0 && (
                      <div>
                        <span className="tweet-meta-label">Mentions</span>
                        <div className="tweet-link-list">
                          {(selectedTweet.user_mentions || []).map(m => (
                            <a
                              key={m.screen_name}
                              href={`https://x.com/${m.screen_name}`}
                              target="_blank"
                              rel="noopener noreferrer"
                            >
                              @{m.screen_name}
                            </a>
                          ))}
                        </div>
                      </div>
                    )}
                    {(selectedTweet.hashtags || []).length > 0 && (
                      <div>
                        <span className="tweet-meta-label">Hashtags</span>
                        <div className="tweet-link-list">
                          {(selectedTweet.hashtags || []).map(h => (
                            <a
                              key={h.text}
                              href={`https://x.com/hashtag/${h.text}`}
                              target="_blank"
                              rel="noopener noreferrer"
                            >
                              #{h.text}
                            </a>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                  <div className="tweet-modal-section">
                    {(selectedTweet.media || []).length > 0 ? (
                      <div className="tweet-media-grid">
                        {(selectedTweet.media || []).map((m, i) => (
                          <img key={i} src={getMediaUrl(m.url)} alt="Tweet media" />
                        ))}
                      </div>
                    ) : (
                      <div className="tweet-meta-item">No media attached.</div>
                    )}
                  </div>
                </div>
                <div className="tweet-modal-footer">
                  <a
                    href={`https://x.com/nobulart/status/${selectedTweet.id}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="modal-action"
                  >
                    View on X
                  </a>
                </div>
              </div>
            </div>
          )}

          <a
            href="https://buymeacoffee.com/nobulart"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Buy me a coffee"
            style={{
              position: 'fixed',
              right: '24px',
              bottom: '24px',
              width: '64px',
              height: '64px',
              zIndex: 40,
              display: 'block'
            }}
          >
            <img
              src="/bmc-logo.svg"
              alt="Buy me a coffee"
              width="64"
              height="64"
              style={{
                width: '64px',
                height: '64px',
                display: 'block'
              }}
            />
          </a>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
